services:
  misub:
    build: .
    image: misub:latest
    container_name: misub
    restart: unless-stopped
    init: true
    ports:
      - "${MISUB_BIND_IP:-0.0.0.0}:${MISUB_PORT:-8080}:8787"
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?请先在 .env 中设置 ADMIN_PASSWORD}"
      TRUST_PROXY: "true"
    volumes:
      - misub-data:/app/data

volumes:
  misub-data:
    # 复用之前 docker run 创建的数据卷，避免 Compose 自动添加项目前缀。
    external: true
    name: misub-data
